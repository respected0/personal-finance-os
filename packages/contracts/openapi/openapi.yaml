openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Personal Finance OS API
  summary: Versioned ledger, daily, report and data-lifecycle contract
  description: >-
    Local and future server contract. P0-A0 exposes typed preview and commit
    boundaries; clients never submit ledger postings or owner identifiers.
  version: 1.14.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:3000
    description: Local development only
security:
  - cookieAuth: []
tags:
  - name: Foundation
    description: Non-financial platform health and contract metadata
  - name: Transactions
    description: AAL2 typed financial commands backed by one ledger engine
  - name: Accounts
    description: Owned institutions, financial accounts and ledger-derived balances
  - name: Categories
    description: Owned income and expense classification references
  - name: Cards
    description: Owned credit-card profiles, statements and exact payment previews
  - name: Subscriptions
    description: Owned renewal cycles with linked gross charges and expense offsets
  - name: Investments
    description: Exact instrument, timestamped price, trade and portfolio boundaries
  - name: Sharing
    description: Owned counterparties, exact shared-expense splits and receivable collection
  - name: Reconciliation
    description: Exact stated-versus-ledger snapshots, resolution links and immutable corrections
  - name: Reports
    description: Ledger-derived monthly metrics with immutable watermark versions
  - name: Data lifecycle
    description: Fresh-step-up export, quarantine restore validation and deletion hold
  - name: Planning
    description: Monthly budgets, ledger-derived actuals, goals and virtual allocations
  - name: Recommendations
    description: Versioned, explainable scenarios consuming the canonical investable result
paths:
  /api/v1/health:
    get:
      operationId: getFoundationHealth
      summary: Read foundation service health
      description: Returns operational metadata only; no user or financial data.
      tags:
        - Foundation
      security: []
      responses:
        "200":
          description: Foundation service is healthy
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "429":
          $ref: "#/components/responses/ProblemResponse"
        "500":
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/transactions/preview:
    post:
      operationId: previewTransaction
      summary: Preview a typed transaction command without writing
      description: >-
        Runs the production ledger engine and returns balanced postings,
        financial effects, engine trace and a deterministic preview hash.
        The preview is not authoritative and performs no database write.
      tags:
        - Transactions
      x-required-aal: aal2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components/ledger.yaml#/TransactionCommand"
      responses:
        "200":
          description: Deterministic transaction preview
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./components/ledger.yaml#/TransactionPreview"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"
        "500":
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/transactions:
    get:
      operationId: listTransactions
      summary: Read cursor-based owned transaction history and exact aggregate
      tags: [Transactions]
      x-required-aal: aal1
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/PeriodFrom" }
        - { $ref: "#/components/parameters/PeriodTo" }
        - { $ref: "#/components/parameters/TransactionType" }
        - { $ref: "#/components/parameters/AccountFilter" }
        - { $ref: "#/components/parameters/CategoryFilter" }
        - { $ref: "#/components/parameters/PageLimit" }
      responses:
        "200":
          description: Filtered history and aggregate from the posted ledger
          content:
            application/json:
              schema:
                $ref: "./components/daily-core.yaml#/TransactionHistoryPage"
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
    post:
      operationId: commitTransaction
      summary: Atomically commit a typed transaction command
      description: >-
        Recomputes the posting plan server-side and commits header, balanced
        postings, links, audit and outbox in one SERIALIZABLE transaction.
        Reusing a key with the same payload returns the stored response;
        a different payload returns idempotency_conflict.
      tags:
        - Transactions
      x-required-aal: aal2
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components/ledger.yaml#/TransactionCommitRequest"
      responses:
        "200":
          description: Idempotent replay of the stored transaction result
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./components/ledger.yaml#/TransactionCommitResponse"
        "201":
          description: Transaction committed atomically
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "./components/ledger.yaml#/TransactionCommitResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"
        "503":
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/transactions/{transactionId}/void:
    post:
      operationId: voidTransaction
      summary: Commit an exact reversal without mutating the original
      tags:
        - Transactions
      x-required-aal: aal2
      parameters:
        - $ref: "#/components/parameters/TransactionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components/ledger.yaml#/VoidRequest"
      responses:
        "200":
          description: Idempotent replay of the reversal result
          content:
            application/json:
              schema:
                $ref: "./components/ledger.yaml#/TransactionCommitResponse"
        "201":
          description: Reversal transaction committed
          content:
            application/json:
              schema:
                $ref: "./components/ledger.yaml#/TransactionCommitResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/transactions/{transactionId}:
    get:
      operationId: getTransaction
      summary: Read an owned transaction with postings, links and audit summary
      tags: [Transactions]
      x-required-aal: aal1
      parameters:
        - { $ref: "#/components/parameters/TransactionId" }
      responses:
        "200":
          description: Owned transaction detail
          content:
            application/json:
              schema:
                { $ref: "./components/daily-core.yaml#/TransactionDetail" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/transactions/{transactionId}/revise:
    post:
      operationId: reviseTransaction
      summary: Commit an exact reversal followed by a replacement command
      tags:
        - Transactions
      x-required-aal: aal2
      parameters:
        - $ref: "#/components/parameters/TransactionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components/ledger.yaml#/ReviseRequest"
      responses:
        "200":
          description: Idempotent replay of the revision result
          content:
            application/json:
              schema:
                $ref: "./components/ledger.yaml#/TransactionCommitResponse"
        "201":
          description: Reversal and replacement committed atomically
          content:
            application/json:
              schema:
                $ref: "./components/ledger.yaml#/TransactionCommitResponse"
        "403":
          $ref: "#/components/responses/ProblemResponse"
        "404":
          $ref: "#/components/responses/ProblemResponse"
        "409":
          $ref: "#/components/responses/ProblemResponse"
        "422":
          $ref: "#/components/responses/ProblemResponse"
  /api/v1/institutions:
    get:
      operationId: listInstitutions
      summary: List owned active institutions
      tags: [Accounts]
      x-required-aal: aal1
      responses:
        "200":
          description: Owned institutions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "./components/daily-core.yaml#/Institution" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
    post:
      operationId: createInstitution
      summary: Create an owned institution reference
      tags: [Accounts]
      x-required-aal: aal2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./components/daily-core.yaml#/InstitutionCreate" }
      responses:
        "201":
          description: Institution created
          content:
            application/json:
              schema: { $ref: "./components/daily-core.yaml#/Institution" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/accounts:
    get:
      operationId: listAccounts
      summary: List owned accounts with ledger-derived current balances
      tags: [Accounts]
      x-required-aal: aal1
      responses:
        "200":
          description: Owned accounts and balances
          content:
            application/json:
              schema:
                type: array
                items:
                  { $ref: "./components/daily-core.yaml#/FinancialAccount" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
    post:
      operationId: createAccount
      summary: Create an account and its unique ledger subaccount
      tags: [Accounts]
      x-required-aal: aal2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./components/daily-core.yaml#/AccountCreate" }
      responses:
        "201":
          description: Account created without an implicit opening balance
          content:
            application/json:
              schema: { $ref: "./components/daily-core.yaml#/FinancialAccount" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/accounts/{accountId}/opening-balance:
    post:
      operationId: createOpeningBalance
      summary: Commit one opening-equity transaction for an owned account
      tags: [Accounts]
      x-required-aal: aal2
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "./components/daily-core.yaml#/OpeningBalanceRequest" }
      responses:
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                { $ref: "./components/ledger.yaml#/TransactionCommitResponse" }
        "201":
          description: Opening balance committed; period income and expense remain zero
          content:
            application/json:
              schema:
                { $ref: "./components/ledger.yaml#/TransactionCommitResponse" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/accounts/{accountId}:
    patch:
      operationId: archiveAccount
      summary: Archive an owned account using optimistic concurrency
      tags: [Accounts]
      x-required-aal: aal2
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - { $ref: "#/components/parameters/IfMatch" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "./components/daily-core.yaml#/AccountArchiveRequest" }
      responses:
        "200":
          description: Account archived; historical ledger rows remain readable
          content:
            application/json:
              schema: { $ref: "./components/daily-core.yaml#/FinancialAccount" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/accounts/{accountId}/balance:
    get:
      operationId: getAccountBalance
      summary: Read the exact ledger-derived owned account balance
      tags: [Accounts]
      x-required-aal: aal1
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
        - name: as_of
          in: query
          schema: { $ref: "#/components/schemas/IsoDate" }
      responses:
        "200":
          description: Original and TRY base balance from posted ledger rows
          content:
            application/json:
              schema: { $ref: "./components/daily-core.yaml#/AccountBalance" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/accounts/{accountId}/snapshots:
    post:
      operationId: createBalanceSnapshot
      summary: Capture an exact stated balance against the ledger at one instant
      tags: [Reconciliation]
      x-required-aal: aal2
      parameters:
        - { $ref: "#/components/parameters/AccountId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components/reconciliation.yaml#/BalanceSnapshotCreate"
      responses:
        "201":
          description: Immutable balance snapshot with exact difference
          content:
            application/json:
              schema:
                $ref: "./components/reconciliation.yaml#/BalanceSnapshot"
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/reconciliations:
    post:
      operationId: createReconciliation
      summary: Open an owned period reconciliation from immutable snapshots
      tags: [Reconciliation]
      x-required-aal: aal2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components/reconciliation.yaml#/ReconciliationCreate"
      responses:
        "201":
          description: Reconciliation session and unresolved snapshot items
          content:
            application/json:
              schema:
                $ref: "./components/reconciliation.yaml#/ReconciliationSession"
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/reconciliations/{reconciliationId}/resolve:
    post:
      operationId: resolveReconciliation
      summary: Resolve one difference with an encrypted reason and required link
      description: >-
        Missing-transaction and adjustment resolutions commit a linked ledger
        transaction atomically. Accepted differences write no financial event.
      tags: [Reconciliation]
      x-required-aal: aal2
      parameters:
        - name: reconciliationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./components/reconciliation.yaml#/ReconciliationResolution"
      responses:
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: "./components/reconciliation.yaml#/ReconciliationResolutionResponse"
        "201":
          description: Difference resolved and linked atomically
          content:
            application/json:
              schema:
                $ref: "./components/reconciliation.yaml#/ReconciliationResolutionResponse"
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/reports/monthly/{period}:
    get:
      operationId: getMonthlyReport
      summary: Read a live, latest-valid or numbered monthly report
      description: >-
        Derives monthly metrics only from posted ledger roles. Transfer
        principal, card payment, investment principal and receivable settlement
        never become income or expense.
      tags: [Reports]
      x-required-aal: aal1
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]{4}-(?:0[1-9]|1[0-2])$" }
        - name: version
          in: query
          schema:
            oneOf:
              - { const: latest }
              - { type: integer, minimum: 1 }
        - { $ref: "#/components/parameters/AccountFilter" }
        - { $ref: "#/components/parameters/CategoryFilter" }
      responses:
        "200":
          description: Ledger-derived monthly report and source/version trace
          content:
            application/json:
              schema:
                { $ref: "./components/monthly-reports.yaml#/MonthlyReport" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/reports/monthly/{period}/versions:
    post:
      operationId: createMonthlyReportVersion
      summary: Preserve a new immutable monthly report snapshot
      tags: [Reports]
      x-required-aal: aal2
      parameters:
        - name: period
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9]{4}-(?:0[1-9]|1[0-2])$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "./components/monthly-reports.yaml#/MonthlyReportVersionCreate",
              }
      responses:
        "201":
          description: New immutable version with source watermark and checksum
          content:
            application/json:
              schema:
                { $ref: "./components/monthly-reports.yaml#/MonthlyReport" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
        "503": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/categories:
    get:
      operationId: listCategories
      summary: List owned active transaction categories
      tags: [Categories]
      x-required-aal: aal1
      parameters:
        - name: type
          in: query
          schema: { enum: [income, expense] }
      responses:
        "200":
          description: Active categories mapped to fixed ledger roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "./components/daily-core.yaml#/Category" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
    post:
      operationId: createCategory
      summary: Create an owned category mapped to its fixed ledger role
      tags: [Categories]
      x-required-aal: aal2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./components/daily-core.yaml#/CategoryCreate" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "./components/daily-core.yaml#/Category" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/cards:
    get:
      operationId: listCreditCards
      summary: List owned credit-card profiles without treating limits as wealth
      tags: [Cards]
      x-required-aal: aal1
      responses:
        "200":
          description: Owned credit-card profile metadata
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "./components/cards.yaml#/CreditCardProfile" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
    post:
      operationId: createCreditCard
      summary: Attach binding credit-card metadata to an owned card account
      tags: [Cards]
      x-required-aal: aal2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "./components/cards.yaml#/CreditCardProfileCreate" }
      responses:
        "201":
          description: Credit-card profile created
          content:
            application/json:
              schema: { $ref: "./components/cards.yaml#/CreditCardProfile" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/cards/{cardId}/statements:
    get:
      operationId: listCreditCardStatements
      summary: List exact statement and partial-payment state for an owned card
      tags: [Cards]
      x-required-aal: aal1
      parameters:
        - { $ref: "#/components/parameters/CardId" }
      responses:
        "200":
          description: Card statements ordered newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "./components/cards.yaml#/CreditCardStatement" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/cards/{cardId}/payments/preview:
    post:
      operationId: previewCreditCardPayment
      summary: Preview liability and bank reduction with optional statement allocation
      tags: [Cards]
      x-required-aal: aal2
      parameters:
        - { $ref: "#/components/parameters/CardId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "./components/cards.yaml#/CardPaymentPreviewRequest" }
      responses:
        "200":
          description: Card payment has zero second-expense and zero net-worth effect
          content:
            application/json:
              schema: { $ref: "./components/ledger.yaml#/TransactionPreview" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/subscriptions:
    get:
      operationId: listSubscriptions
      summary: List subscription expectations, renewal dates and actual cycle net
      tags: [Subscriptions]
      x-required-aal: aal1
      responses:
        "200":
          description: Owned active subscriptions and unique monthly cycles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "./components/subscriptions.yaml#/Subscription" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
    post:
      operationId: createSubscription
      summary: Create an owned subscription and its visible current renewal cycle
      tags: [Subscriptions]
      x-required-aal: aal2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "./components/subscriptions.yaml#/SubscriptionCreate" }
      responses:
        "201":
          description: Subscription and unique current cycle created
          content:
            application/json:
              schema: { $ref: "./components/subscriptions.yaml#/Subscription" }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "404": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/subscription-cycles/{cycleId}/charge:
    post:
      operationId: chargeSubscriptionCycle
      summary: Commit the cycle gross expense and bind its transaction atomically
      tags: [Subscriptions]
      x-required-aal: aal2
      parameters:
        - { $ref: "#/components/parameters/CycleId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "./components/subscriptions.yaml#/SubscriptionChargeRequest",
              }
      responses:
        "200":
          {
            description: Idempotent replay,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        $ref: "./components/ledger.yaml#/TransactionCommitResponse",
                      },
                  },
              },
          }
        "201":
          {
            description: Gross charge committed,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        $ref: "./components/ledger.yaml#/TransactionCommitResponse",
                      },
                  },
              },
          }
        "403": { $ref: "#/components/responses/ProblemResponse" }
        "409": { $ref: "#/components/responses/ProblemResponse" }
        "422": { $ref: "#/components/responses/ProblemResponse" }
  /api/v1/subscription-cycles/{cycleId}/cashback:
    post:
      operationId: creditSubscriptionCashback
      summary: Commit an expense offset linked to the cycle charge transaction
      tags: [Subscriptions]
      x-required-aal: aal2
      parameters:
        - { $ref: "#/components/parameters/CycleId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "./components/subscriptions.yaml#/SubscriptionCashbackRequest",
              }
      responses:
        "200":
          {
            description: Idempotent replay,
            content:
              {
                application/json:
                  {
                    schema:
                      {
