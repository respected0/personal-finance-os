components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: pfos_session
      description: HttpOnly BFF session cookie; provider tokens are never exposed.
  headers:
    RequestId:
      description: UUID request correlation identifier
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
  parameters:
    TransactionId:
      name: transactionId
      in: path
      required: true
      description: Owned transaction UUID; invisible cross-user IDs return not_found.
      schema:
        $ref: "#/components/schemas/Uuid"
    AccountId:
      name: accountId
      in: path
      required: true
      description: Owned financial account UUID; cross-user IDs are invisible.
      schema: { $ref: "#/components/schemas/Uuid" }
    CardId:
      name: cardId
      in: path
      required: true
      description: Owned credit-card account UUID; cross-user IDs are invisible.
      schema: { $ref: "#/components/schemas/Uuid" }
    CycleId:
      name: cycleId
      in: path
      required: true
      description: Owned subscription-cycle UUID; cross-user IDs are invisible.
      schema: { $ref: "#/components/schemas/Uuid" }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 1000 }
    PeriodFrom:
      name: period_from
      in: query
      schema: { $ref: "#/components/schemas/IsoDate" }
    PeriodTo:
      name: period_to
      in: query
      schema: { $ref: "#/components/schemas/IsoDate" }
    TransactionType:
      name: type
      in: query
      schema: { type: string }
    AccountFilter:
      name: account
      in: query
      schema: { $ref: "#/components/schemas/Uuid" }
    CategoryFilter:
      name: category
      in: query
      schema: { $ref: "#/components/schemas/Uuid" }
    PageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Positive resource row version read by the client.
      schema: { type: integer, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID; scoped to the authenticated user.
      schema:
        $ref: "#/components/schemas/Uuid"
  responses:
    ProblemResponse:
      description: RFC 7807 compatible problem details response
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            $ref: "./components/problem-details.yaml#/ProblemDetails"
  schemas:
    Uuid:
      type: string
      format: uuid
    IsoDate:
      type: string
      format: date
    IsoDateTime:
      type: string
      format: date-time
    DecimalString:
      type: string
      pattern: "^-?(?:0|[1-9][0-9]*)\\.[0-9]+$"
      examples:
        - "1.31"
    MoneyString:
      allOf:
        - $ref: "#/components/schemas/DecimalString"
      description: Canonical decimal JSON string; JavaScript number is forbidden.
      examples:
        - "10000.00"
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - version
        - request_id
        - timestamp
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
        request_id:
          $ref: "#/components/schemas/Uuid"
        timestamp:
          $ref: "#/components/schemas/IsoDateTime"
