SensitiveStepUp:
  type: object
  additionalProperties: false
  required: [code]
  properties:
    code: { type: string, pattern: "^[0-9]{6}$", writeOnly: true }

SensitiveStepUpResult:
  type: object
  additionalProperties: false
  required: [verifiedAt, expiresAt]
  properties:
    verifiedAt: { type: string, format: date-time }
    expiresAt: { type: string, format: date-time }

DataExportCreate:
  type: object
  additionalProperties: false
  required: [format, scope]
  properties:
    format: { enum: [csv, full_fidelity] }
    scope:
      type: array
      minItems: 1
      maxItems: 30
      items: { type: string, minLength: 1, maxLength: 80 }
    passphrase: { type: string, minLength: 12, maxLength: 256, writeOnly: true }

DataExport:
  type: object
  additionalProperties: false
  required:
    [
      id,
      format,
      status,
      scope,
      snapshotWatermark,
      schemaVersion,
      checksum,
      expiresAt,
      contentBase64,
      encryption,
    ]
  properties:
    id: { type: string, format: uuid }
    format: { enum: [csv, full_fidelity] }
    status: { enum: [completed, expired] }
    scope:
      type: array
      items: { type: string }
    snapshotWatermark: { type: string, format: date-time }
    schemaVersion: { const: 17 }
    checksum: { type: string, pattern: "^[a-f0-9]{64}$" }
    expiresAt: { type: string, format: date-time }
    contentBase64:
      oneOf:
        - { type: string, contentEncoding: base64 }
        - { type: "null" }
    encryption:
      oneOf:
        - $ref: "#/ArchiveEncryption"
        - { type: "null" }

ArchiveEncryption:
  type: object
  additionalProperties: false
  required: [scheme, kdf, keysetReference, parameters]
  properties:
    scheme: { const: AES-256-GCM }
    kdf: { const: Argon2id }
    keysetReference: { type: string, minLength: 1 }
    parameters:
      type: object
      additionalProperties: false
      required: [memoryKiB, iterations, parallelism]
      properties:
        memoryKiB: { const: 65536 }
        iterations: { const: 3 }
        parallelism: { const: 1 }

RestoreValidate:
  type: object
  additionalProperties: false
  required: [archiveBase64, checksum, passphrase]
  properties:
    archiveBase64: { type: string, contentEncoding: base64 }
    checksum: { type: string, pattern: "^[a-f0-9]{64}$" }
    passphrase: { type: string, minLength: 12, maxLength: 256, writeOnly: true }

RestoreValidation:
  type: object
  additionalProperties: false
  required: [id, status, confirmationToken, expiresAt, manifest, validation]
  properties:
    id: { type: string, format: uuid }
    status: { const: pass }
    confirmationToken: { type: string, writeOnly: true }
    expiresAt: { type: string, format: date-time }
    manifest: { type: object }
    validation:
      type: object
      additionalProperties: false
      required:
        [
          quarantine,
          fileChecksumDifferences,
          relationshipDifferences,
          ledgerBalanceDifferences,
          reportReconciliationDifferences,
          records,
          transactions,
          postings,
        ]
      properties:
        quarantine: { const: pg_temp }
        fileChecksumDifferences: { const: 0 }
        relationshipDifferences: { const: 0 }
        ledgerBalanceDifferences: { const: 0 }
        reportReconciliationDifferences: { const: 0 }
        records: { type: integer, minimum: 0 }
        transactions: { type: integer, minimum: 0 }
        postings: { type: integer, minimum: 0 }

RestoreApply:
  type: object
  additionalProperties: false
  required: [confirmationToken]
  properties:
    confirmationToken:
      { type: string, minLength: 20, maxLength: 200, writeOnly: true }

AccountDeletionCreate:
  type: object
  additionalProperties: false
  required: [confirmation]
  properties:
    confirmation: { const: HESABIMI SIL }

AccountDeletion:
  type: object
  additionalProperties: false
  required: [id, status, requestedAt, scheduledFor, backupExpiresAt]
  properties:
    id: { type: string, format: uuid }
    status: { enum: [pending, cancelled] }
    requestedAt: { type: string, format: date-time }
    scheduledFor: { type: string, format: date-time }
    backupExpiresAt: { type: string, format: date-time }
