name: Database

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      negative_migration:
        description: Add an ephemeral destructive statement and require migration policy failure
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: database-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-smoke:
    name: database / migration-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install exact pnpm
        run: npm install --global pnpm@11.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Create controlled migration failure
        if: ${{ inputs.negative_migration }}
        run: echo 'DROP SCHEMA app_identity CASCADE;' >> supabase/migrations/00000000000000_m0_foundation.sql
      - name: Run fresh migration smoke
        run: |
          set -o pipefail
          mkdir -p .tmp/ci
          pnpm db:smoke 2>&1 | tee .tmp/ci/migration-smoke.log
      - name: Verify domain coverage and float boundary
        run: |
          set -o pipefail
          pnpm test:ledger:coverage 2>&1 | tee .tmp/ci/ledger-coverage.log
      - name: Verify ledger invariants and UAT rules
        run: |
          set -o pipefail
          pnpm ledger:integration 2>&1 | tee .tmp/ci/ledger-acceptance.log
      - name: Upload migration smoke report
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: migration-smoke-report
          path: |
            .tmp/ci/migration-smoke.log
            .tmp/ci/ledger-coverage.log
            .tmp/ci/ledger-acceptance.log
          if-no-files-found: error
          retention-days: 14
